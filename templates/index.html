{% extends 'base.html' %}

{% block content %}

<style>
* {
    box-sizing: border-box;
}

.majd-page {
    min-height: 100vh;
    background: linear-gradient(180deg, #f5fbff 0%, #eef8fc 50%, #ffffff 100%);
    direction: rtl;
    color: #000;
    font-family: Tahoma, Arial, sans-serif;
}

.majd-header {
    background: linear-gradient(135deg, #eaf8fd, #d9f1fa, #f8fdff);
    text-align: center;
    padding: 38px 15px 30px;
    border-bottom: 1px solid #c9e8f3;
}

.brand-en {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #111;
}

.brand-ar {
    margin: 5px 0 10px;
    font-size: 38px;
    font-weight: 900;
    color: #000;
}

.brand-description {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}

.trust-bar {
    background: #fff;
    text-align: center;
    padding: 13px 10px;
    font-size: 16px;
    font-weight: 800;
    border-bottom: 1px solid #d8edf5;
}

.majd-container {
    max-width: 950px;
    margin: auto;
    padding: 20px 15px 50px;
}

.news-box {
    background: #fff;
    border-right: 6px solid #c62828;
    border-radius: 18px;
    padding: 17px 18px;
    margin-bottom: 28px;
    box-shadow: 0 5px 18px rgba(25,80,100,.08);
}

.news-title {
    color: #b71c1c;
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 7px;
}

.news-text {
    line-height: 1.9;
    font-size: 15px;
}

.section-heading {
    text-align: center;
    margin: 25px 0 20px;
}

.section-heading h2 {
    margin: 0 0 7px;
    font-size: 25px;
    font-weight: 900;
}

.section-heading p {
    margin: 0;
    font-size: 14px;
    line-height: 1.8;
}

.aid-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.aid-banner {
    display: block;
    text-decoration: none;
    color: #000;
    background: linear-gradient(135deg, #fff, #f4fbfe, #e9f7fc);
    border: 1px solid #c7e9f3;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(36,105,130,.09);
    position: relative;
    overflow: hidden;
}

.aid-banner::before {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: #168dcc;
}

.aid-content {
    display: flex;
    align-items: center;
    gap: 16px;
}

.aid-icon {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 17px;
    background: #e1f5fb;
    border: 1px solid #b9e3ef;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
}
